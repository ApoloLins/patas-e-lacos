<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas & Laços | Cadastro de Tutor</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .cadastro-wrapper { max-width: 750px; margin: 40px auto; padding: 0 20px; }
        .cadastro-card { background: white; padding: 45px; border-radius: 25px; box-shadow: 0 15px 40px var(--shadow); }
        .cadastro-card h2 { font-family: 'Montserrat'; color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; text-align: center; }
        .cadastro-card p { font-size: 0.9rem; color: #666; margin-bottom: 30px; text-align: center; }
        .form-grid-cadastro { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .group-cadastro { text-align: left; }
        .group-cadastro label { display: block; font-family: 'Montserrat'; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; letter-spacing: 0.5px; }
        .input-cadastro { width: 100%; padding: 14px 20px; border: 2px solid #eee; border-radius: 50px; font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; outline: none; transition: 0.3s; background: #fff; box-sizing: border-box; }
        .input-cadastro:focus { border-color: var(--primary); }
        @media (max-width: 768px) { .form-grid-cadastro { grid-template-columns: 1fr; } }
    </style>
</head>
<body style="background: var(--bg);">

<header class="main-header">
    <nav class="nav-container">
        <div class="logo-area"><img src="img/logo.png" alt="Patas & Laços" class="logo-img"></div>
        <ul class="nav-links">
            <li><a href="login-tutor.html" class="nav-item">Página de Login 🔑</a></li>
        </ul>
    </nav>
</header>

<div class="cadastro-wrapper">
    <main class="cadastro-card">
        <h2>Criar Conta de Tutor</h2>
        <p>Preencha seus dados uma única vez para liberar envios rápidos de adoção e doação</p>

        <form onsubmit="realizarCadastroTutor(event)">
            <div class="form-grid-cadastro">
                <div class="group-cadastro">
                    <label>Nome Completo</label>
                    <input type="text" id="cad-nome" class="input-cadastro" placeholder="Seu nome completo" required>
                </div>
                <div class="group-cadastro">
                    <label>E-mail de contato</label>
                    <input type="email" id="cad-email" class="input-cadastro" placeholder="exemplo@email.com" required>
                </div>
                <div class="group-cadastro">
                    <label>WhatsApp / Telefone</label>
                    <input type="text" id="cad-telefone" class="input-cadastro" placeholder="(81) 99999-9999" required>
                </div>
                <div class="group-cadastro">
                    <label>CPF</label>
                    <input type="text" id="cad-cpf" class="input-cadastro" placeholder="000.000.000-00" required>
                </div>
                <div class="group-cadastro">
                    <label>Documento de Identidade (RG)</label>
                    <input type="text" id="cad-rg" class="input-cadastro" placeholder="Ex: 9.876.543 SDS/PE" required>
                </div>
                <div class="group-cadastro">
                    <label>Data de Nascimento</label>
                    <input type="text" id="cad-nascimento" class="input-cadastro" placeholder="DD/MM/AAAA" required>
                </div>
                <div class="group-cadastro">
                    <label>Escolha um Nome de Usuário (Login)</label>
                    <input type="text" id="cad-username" class="input-cadastro" placeholder="Ex: apolo.mendes" required>
                </div>
                <div class="group-cadastro">
                    <label>Defina uma Senha</label>
                    <input type="password" id="cad-senha" class="input-cadastro" placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>

            <center>
                <button type="submit" class="btn-main" style="margin-top: 35px; border: none; padding: 14px 45px; font-size: 1rem; cursor: pointer;">
                    Finalizar Meu Cadastro ✔
                </button>
            </center>
        </form>
    </main>
</div>

<footer class="main-footer">
    <div class="footer-content">
        <div class="footer-bottom">
            <p>&copy; 2026 Patas & Laços - Portal de Adoção e Cuidados.</p>
        </div>
    </div>
</footer>

<script>
    function realizarCadastroTutor(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('cad-username').value.trim().toLowerCase();
        const senhaInput = document.getElementById('cad-senha').value;

        const novoTutor = {
            nome: document.getElementById('cad-nome').value.trim(),
            email: document.getElementById('cad-email').value.trim(),
            telefone: document.getElementById('cad-telefone').value.trim(),
            cpf: document.getElementById('cad-cpf').value.trim(),
            rg: document.getElementById('cad-rg').value.trim(),
            nascimento: document.getElementById('cad-nascimento').value.trim(),
            username: usernameInput,
            senha: senhaInput
        };

        localStorage.setItem('dadosTutor', JSON.stringify(novoTutor));

        alert("Cadastro efetuado com sucesso! Agora você já pode logar com as suas novas credenciais.");
        window.location.href = "login-tutor.html";
    }
</script>
</body>
</html>
