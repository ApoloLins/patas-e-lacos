<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas & Laços | Quero Doar</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .doar-wrapper { max-width: 650px; margin: 40px auto; padding: 0 20px; }
        .doar-card { background: white; padding: 45px; border-radius: 25px; box-shadow: 0 15px 40px var(--shadow); }
        .doar-card h2 { font-family: 'Montserrat'; color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; text-align: center; }
        .doar-card p { font-size: 0.9rem; color: #666; margin-bottom: 30px; text-align: center; line-height: 1.5; }

        .form-group-doar { text-align: left; margin-bottom: 22px; }
        .form-group-doar label { display: block; font-family: 'Montserrat'; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-bottom: 8px; letter-spacing: 0.5px; }
        .input-doar, .select-doar, .textarea-doar { width: 100%; padding: 14px 20px; border: 2px solid #eee; border-radius: 50px; font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; outline: none; transition: 0.3s; background: #fff; box-sizing: border-box; }
        .input-doar:focus, .select-doar:focus, .textarea-doar:focus { border-color: var(--primary); }
        .textarea-doar { border-radius: 20px; resize: vertical; min-height: 100px; }
    </style>
</head>
<body style="background: var(--bg);">

<header class="main-header">
    <nav class="nav-container">
        <div class="logo-area">
            <img src="img/logo.png" alt="Patas & Laços" class="logo-img">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item">Início</a></li>
            <li><a href="catalogo.html" class="nav-item">Adotar</a></li>
            <li><a href="doar.html" class="nav-item active">Quero Doar</a></li>
            <li><a href="login-tutor.html" class="nav-item btn-main" style="color: white; padding: 8px 20px; margin-left: 10px; text-decoration: none;">Área do Tutor 👤</a></li>
        </ul>
    </nav>
</header>

<div class="doar-wrapper">
    <main class="doar-card">
        <h2>Cadastrar Pet para Doação</h2>
        <p>Preencha os dados do animal resgatado para disponibilizá-lo no nosso catálogo geral após triagem interna da ONG.</p>

        <form onsubmit="interceptarFluxoDoacao(event)">
            <div class="form-group-doar">
                <label for="pet-nome">Nome do Animal</label>
                <input type="text" id="pet-nome" class="input-doar" placeholder="Ex: Pipoca, Amarelo" required>
            </div>

            <div class="form-group-doar">
                <label for="pet-tipo">Espécie</label>
                <select id="pet-tipo" class="select-doar" required>
                    <option value="" disabled selected>Selecione a espécie</option>
                    <option value="Cachorro">Cachorro</option>
                    <option value="Gato">Gato</option>
                </select>
            </div>

            <div class="form-group-doar">
                <label for="pet-idade">Idade Aproximada</label>
                <input type="text" id="pet-idade" class="input-doar" placeholder="Ex: 2 meses, 1 ano" required>
            </div>

            <div class="form-group-doar">
                <label for="pet-porte">Porte Estimado</label>
                <select id="pet-porte" class="select-doar" required>
                    <option value="" disabled selected>Selecione o porte</option>
                    <option value="Pequeno">Pequeno (Até 10kg)</option>
                    <option value="Médio">Médio (11kg a 25kg)</option>
                    <option value="Grande">Grande (Acima de 25kg)</option>
                </select>
            </div>

            <div class="form-group-doar">
                <label for="pet-comportamento">Perfil Comportamental / Detalhes</label>
                <textarea id="pet-comportamento" class="textarea-doar" placeholder="Conte sobre o temperamento dele..." required></textarea>
            </div>

            <center>
                <button type="submit" class="btn-main" style="margin-top: 20px; border: none; padding: 14px 45px; font-size: 1rem; cursor: pointer;">
                    Enviar para Avaliação da ONG 🐾
                </button>
            </center>
        </form>
    </main>
</div>

<footer class="main-footer">
    <div class="footer-content">
        <div class="footer-bottom">
            <p>&copy; 2026 Patas & Laços - Portal de Adoção e Cuidados.</p>
        </div>
    </div>
</footer>

<script>
    window.onload = function() {
        if (localStorage.getItem('user.logado') === 'true' && localStorage.getItem('dadosDoacaoPendente')) {
            const dadosPet = JSON.parse(localStorage.getItem('dadosDoacaoPendente'));

            // Restaura o rascunho do pet nos campos da tela
            document.getElementById('pet-nome').value = dadosPet.nome;
            document.getElementById('pet-tipo').value = dadosPet.tipo;
            document.getElementById('pet-idade').value = dadosPet.idade;
            document.getElementById('pet-porte').value = dadosPet.porte;
            document.getElementById('pet-comportamento').value = dadosPet.comportamento;

            localStorage.removeItem('dadosDoacaoPendente');

            alert("🔒 Conta Identificada!\n\nO perfil do animal foi anexado à sua conta e encaminhado com sucesso para homologação no catálogo.");
            window.location.href = "portal.html";
        }
    }

    function interceptarFluxoDoacao(e) {
        e.preventDefault();

        const rascunhoPet = {
            nome: document.getElementById('pet-nome').value,
            tipo: document.getElementById('pet-tipo').value,
            idade: document.getElementById('pet-idade').value,
            porte: document.getElementById('pet-porte').value,
            comportamento: document.getElementById('pet-comportamento').value
        };

        localStorage.setItem('dadosDoacaoPendente', JSON.stringify(rascunhoPet));

        if (localStorage.getItem('user.logado') !== 'true') {
            alert("Dados do bicho gravados!\n\nPara concluir e enviar o pet para doação, precisamos que você faça login na sua Conta de Tutor.");
            window.location.href = "login-tutor.html";
        } else {
            alert("Dados do pet enviados com sucesso!");
            window.location.href = "portal.html";
        }
    }
</script>
</body>
</html>
