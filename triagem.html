<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Triagem | Patas & Laços</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .form-section { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .form-section h4 { margin-bottom: 20px; color: var(--primary); font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
        .grid-2 { display: flex; gap: 15px; }
        .grid-2 input, .grid-2 div { flex: 1; }
        .grid-3 { display: flex; gap: 15px; }
        .grid-3 .flex-3 { flex: 3; }
        .grid-3 .flex-1 { flex: 1; }
        .input-padrao { width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .input-padrao:focus { border-color: var(--primary); }
        .file-label { display: block; font-weight: bold; font-size: 0.85rem; color: #555; margin-bottom: 5px; margin-top: 10px; }
        .currency-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        .currency-wrapper .symbol { position: absolute; left: 15px; font-family: 'IBM Plex Sans'; font-size: 0.95rem; color: #555; font-weight: 600; pointer-events: none; }
        .currency-wrapper input { padding-left: 45px; }
        #mensagem-sucesso { display: none; text-align: center; padding: 40px 20px; }
        #mensagem-sucesso h3 { font-family: 'Montserrat'; color: var(--secondary); font-size: 1.8rem; margin-bottom: 15px; }
        #mensagem-sucesso p { font-size: 1.1rem; color: var(--text); margin-bottom: 30px; line-height: 1.6; }
        @media (max-width: 768px) {
            .grid-2, .grid-3 { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body style="background: var(--bg); padding: 20px 10px;">

<div style="width: 100%; max-width: 750px; margin: 0 auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 40px var(--shadow); box-sizing: border-box;">
    
    <div id="container-formulario">
        <h2 style="font-family: 'Montserrat'; color: var(--primary); margin-bottom: 35px; text-align: center;">Inscrição para Adoção</h2>
        <form id="form-triagem" onsubmit="enviarFormulario(event)">
            
            <div class="form-section">
                <h4>Dados Pessoais</h4>
                <input type="text" id="nome" placeholder="Nome Completo" class="input-padrao" required>
                <div class="grid-2">
                    <input type="text" id="cpf" placeholder="CPF: 000.000.000-00" class="input-padrao" oninput="mascaraCPF(this)" maxlength="14" required>
                    <input type="text" id="rg" placeholder="RG" class="input-padrao" required>
                </div>
                <div class="grid-2">
                    <div style="margin-bottom: 15px;">
                        <span style="font-size: 0.8rem; color: #777; display:block; margin-bottom:4px;">Data de Nascimento:</span>
                        <input type="date" id="nascimento" class="input-padrao" style="margin-bottom:0;" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <span style="font-size: 0.8rem; color: #777; display:block; margin-bottom:4px;">Telefone (WhatsApp):</span>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000" class="input-padrao" style="margin-bottom:0;" oninput="mascaraTelefone(this)" maxlength="15" required>
                    </div>
                </div>

                <div class="grid-3">
                    <input type="text" id="cep" placeholder="CEP: 00000-000" class="input-padrao flex-1" oninput="mascaraCEP(this)" maxlength="9" required>
                    <input type="text" id="rua" placeholder="Rua / Logradouro" class="input-padrao flex-3" required>
                </div>
                <div class="grid-3">
                    <input type="text" id="numero" placeholder="Nº" class="input-padrao flex-1" required>
                    <input type="text" id="bairro" placeholder="Bairro" class="input-padrao flex-3" required>
                </div>
                <div class="grid-3">
                    <input type="text" id="cidade" placeholder="Cidade" class="input-padrao flex-3" required>
                    <input type="text" id="estado" placeholder="Estado" class="input-padrao flex-1" maxlength="2" required>
                </div>
                <input type="text" id="complemento" placeholder="Complemento (Opcional)" class="input-padrao">
                <input type="email" id="email" placeholder="E-mail" class="input-padrao" required>
            </div>

            <div class="form-section">
                <h4>Informações Socioeconômicas</h4>
                <input type="text" id="profissao" placeholder="Profissão" class="input-padrao" required>
                <div class="grid-2">
                    <div style="margin-bottom: 15px; width: 100%;">
                        <span style="font-size: 0.8rem; color: #777; display:block; margin-bottom:4px;">Renda Mensal:</span>
                        <div class="currency-wrapper"><span class="symbol">R$</span><input type="text" id="renda-mensal" class="input-padrao" oninput="mascaraMoeda(this)" required></div>
                    </div>
                    <div style="margin-bottom: 15px; width: 100%;">
                        <span style="font-size: 0.8rem; color: #777; display:block; margin-bottom:4px;">Renda Per Capita:</span>
                        <div class="currency-wrapper"><span class="symbol">R$</span><input type="text" id="renda-capita" class="input-padrao" oninput="mascaraMoeda(this)" required></div>
                    </div>
                </div>
            </div>

            <div class="form-section" style="border-bottom: none;">
                <h4>Documentação Anexa</h4>
                <label class="file-label">FRENTE DO RG:</label><input type="file" class="input-padrao" required>
                <label class="file-label">VERSO DO RG:</label><input type="file" class="input-padrao" required>
                <label class="file-label">COMPROVANTE DE RESIDÊNCIA:</label><input type="file" class="input-padrao" required>
                <label class="file-label">CONTRACHEQUE:</label><input type="file" class="input-padrao" required>
            </div>

            <button type="submit" class="btn-main" style="border: none; width: 100%; padding: 15px;">Enviar Informações para Análise</button>
        </form>
    </div>

    <div id="mensagem-sucesso">
        <span style="font-size: 4rem;">🎉</span>
        <h3>Inscrição Confirmada!</h3>
        <p>Você entrou na lista de análise. Em até 5 dias úteis, a equipe técnica da ONG entrará em contato.</p>
        <button onclick="window.close();" class="btn-main" style="border:none;">Fechar Janela</button>
    </div>
</div>

<script>
function mascaraCPF(i) { let v = i.value.replace(/\D/g, ""); v = v.replace(/(\d{3})(\d)/, "$1.$2"); v = v.replace(/(\d{3})(\d)/, "$1.$2"); v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); i.value = v; }
function mascaraTelefone(i) { let v = i.value.replace(/\D/g, ""); v = v.replace(/^(\d{2})(\d)/g, "($1) $2"); v = v.replace(/(\d{5})(\d)/, "$1-$2"); i.value = v; }
function mascaraCEP(i) { let v = i.value.replace(/\D/g, ""); v = v.replace(/^(\d{5})(\d)/, "$1-$2"); i.value = v; }
function mascaraMoeda(i) { let v = i.value.replace(/\D/g, ""); v = (v / 100).toFixed(2) + ""; v = v.replace(".", ","); v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1."); i.value = v === "0,00" ? "" : v; }

function enviarFormulario(e) {
    e.preventDefault();
    if (document.getElementById('cpf').value.replace(/\D/g, '').length !== 11) { alert("CPF inválido."); return; }
    if (document.getElementById('telefone').value.replace(/\D/g, '').length !== 11) { alert("Telefone inválido."); return; }
    document.getElementById('container-formulario').style.display = 'none';
    document.getElementById('mensagem-sucesso').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
